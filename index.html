<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/main.css">

    <!-- Police: Manrope -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Manrope:wght@200..800&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
     <script src="/script/script.js" defer></script>
    <title>Horairo - Visiteur</title>
</head>
<body>
    <div class="container">

        <header class="header">
            <a href="#" class="logo">Horairo</a>
            
            <div class="navigation">
                <img src="Styles/img/moon.svg" alt="theme button" class="theme-btn moon">
                <img src="Styles/img/sun.svg" alt="theme button" class="theme-btn sun">
                <img src="/Styles/img/humberger light.svg" alt="ham" class="ham light-ham">
                <img src="/Styles/img/humberger dark.svg" alt="ham" class="ham dark-ham">
                <nav>
                    <a href="#" class="btn">/Admin</a>
                </nav>
            </div>
            <!-- overlay -->
            <div class="overlay"></div>
            <div class="off-screen-menu">
                <a href="#" class="btn">/Admin</a>
            </div>
        </header>
        
        <main class="main">
            <h1>Events</h1>
            <div class="categories">
                <div class="All active btn-categorie">All</div>
                <div class="Sport btn-categorie">Sport</div>
                <div class="Conference btn-categorie">Conference</div>
                <div class="Atelier btn-categorie">Atelier</div>
                <div class="Autre btn-categorie">Autre</div>
            </div>
        </main>

    </div>
</body>
</html>
