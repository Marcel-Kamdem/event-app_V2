<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/main.css">

    <!-- Police: Manrope -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Manrope:wght@200..800&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
     <script src="/script/admin.js" defer></script>
    <title>Horairo - Administrateur</title>
</head>
<body>
    <div class="container">

        <header class="header">
            <a href="#" class="logo">Horairo</a>
            
            <div class="navigation">
                <img src="/Styles/img/moon.svg" alt="theme button" class="theme-btn moon">
                <img src="/Styles/img/sun.svg" alt="theme button" class="theme-btn sun">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="23" viewBox="0 0 32 23" fill="none" class="ham">
                    <rect width="32" height="5" rx="2.5" fill="#0D0D0D"/>
                    <rect y="9" width="32" height="5" rx="2.5" fill="#0D0D0D"/>
                    <rect y="18" width="32" height="5" rx="2.5" fill="#0D0D0D"/>
                </svg>
                <nav>
                    <a href="/index.html" class="btn">/Visiteur</a>
                </nav>
            </div>
            <!-- overlay -->
            <div class="overlay"></div>
            <div class="off-screen-menu">
                <a href="/index.html" class="btn">/Visiteur</a>
            </div>
        </header>
        
        <main class="main">
            <h1>Events - Dashboard</h1>
            <p>Ici manager vos evenements : Ajouter, Modifiez et supprimez</p>

            <div class="events-managements">
                <div class="event-manage add">
                    <h4>Creer un Evenement</h4>
                    <div class="btn add">Add</div>
                </div>

                <div class="event-manage modify">
                    <h4>Modifier un Evenement</h4>
                    <div class="btn">Update</div>
                </div>

                <div class="event-manage delete">
                    <h4>Supprimer un Evenement</h4>
                    <div class="btn">Delete</div>
                </div>
            </div>


            <!-- Formulaire: creer, modifier, supprimer -->
             <div class="creation-form">
                <div class="creation-form_description">
                    <h4 class="creation-form_title">Creer un evenement</h4>
                    <p class="creation-form_text">Creer un moment inoubliable</p>
                </div> 
                <div class="inscription-form_form">
                    <form action="" method="get" class="formulaire_inscription">
                        <div class="nom">
                            <label for="name">Titre</label>
                            <input type="text" name="title" id="title" required>
                        </div>
                        <div class="categorie"><!--a modifier categorie : liste-->
                            <label for="categorie">categorie</label>
                            <select name="categorie" id="categorie" required>
                                <option value="Conference">Conference</option>
                                <option value="Sport">Sport</option>
                                <option value="Atelier">Atelier</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                        <div class="date-lieu" id="date-lieu">
                            <div class="date">
                                <label for="date">Date</label>
                                <input type="date" name="date" id="date">
                            </div>
                            <div class="lieu">
                                <label for="lieu">Lieu</label>
                                <input type="text" name="lieu" id="lieu">
                            </div>
                        </div>
                        <div class="description">
                            <label for="description">description</label>
                            <textarea name="description" id="description"></textarea>
                        </div>
                        <div class="capacite">
                            <label for="capacite">capacite</label>
                            <input type="number" name="capacite" id="capacite">
                        </div>
                    </form>
                </div>
                <div class="validation">
                    <div class="btn">Ajouter</div>
                </div> 
             </div>
        </main>

    </div>
</body>
</html>
